<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">P for Packaging and Box Design</title>
<desc id="description">A 6.5-second looping animation. A folded red and black P gains an opening carton with two flaps. It introduces packaging and box design and illustrative flat dieline, box structure and retail pack concepts.</desc>
<metadata>1920 by 1080; 16:9; 6.5-second loop; geometric P and blue, red, black and cream palette adapted from 16_P_packaging_design.png; no external assets. Examples are illustrative, not fabrication-ready.</metadata>
